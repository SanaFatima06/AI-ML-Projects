<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SMS Spam Detector</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Arial", sans-serif;
            background: linear-gradient(135deg, #f8d7da, #f5e6e0);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: #fff0f3;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 400px;
            text-align: center;
        }

        h1 {
            color: #7b4b3a;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border-radius: 12px;
            border: 2px solid #d8a7b1;
            outline: none;
            resize: none;
            font-size: 14px;
            background-color: #fff;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            background-color: #b56576;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #7b4b3a;
        }

        .result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #7b4b3a;
        }

        .spam {
            color: #c1121f;
        }

        .ham {
            color: #2a9d8f;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>📩 Spam Detector</h1>

        <form action="/predict" method="POST">
            <textarea name="message" placeholder="Type your message here..."></textarea>
            <br>
            <button type="submit">Check Message</button>
        </form>

        {% if prediction %}
            <div class="result">
                Result:
                <span class="{% if 'SPAM' in prediction %}spam{% else %}ham{% endif %}">
                    {{ prediction }}
                </span>
            </div>
        {% endif %}
    </div>

</body>
</html>
